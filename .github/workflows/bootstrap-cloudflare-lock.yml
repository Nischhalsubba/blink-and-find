name: Bootstrap Cloudflare dependencies

on:
  push:
    branches:
      - fix/complete-ci-cloudflare
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  package-lock:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/complete-ci-cloudflare')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-ci-cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add pinned Cloudflare tooling and CI script aliases
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          pkg.scripts = {
            ...pkg.scripts,
            check: 'npm run lint && npm run typecheck && npm run audit:prod',
            'build:cloudflare': 'opennextjs-cloudflare build',
            'preview:cloudflare': 'opennextjs-cloudflare preview',
            'deploy:cloudflare': 'opennextjs-cloudflare deploy',
            'test:e2e': 'playwright test',
            'test:supabase-advisors': 'node scripts/check-supabase-advisors.mjs'
          };
          pkg.dependencies = {
            ...pkg.dependencies,
            '@opennextjs/cloudflare': '1.20.2'
          };
          pkg.devDependencies = {
            ...pkg.devDependencies,
            wrangler: '4.114.0'
          };

          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Commit package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add reproducible Cloudflare build tooling"
          git push origin HEAD:fix/complete-ci-cloudflare
