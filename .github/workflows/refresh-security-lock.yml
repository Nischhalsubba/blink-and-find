name: Refresh security lockfile

on:
  push:
    branches:
      - fix/complete-ci-cloudflare

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/complete-ci-cloudflare
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refresh the lockfile with patched overrides
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit the refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-security-lock.yml
          git add package.json package-lock.json
          git commit -m "Refresh lockfile with patched transitive dependencies"
          git push origin HEAD:fix/complete-ci-cloudflare
