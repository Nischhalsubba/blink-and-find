name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, builds, audit, and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Lint, typecheck, and production audit
        run: npm run check
      - name: Build for Next.js hosts
        run: npm run build
      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
      - name: Validate Wrangler deployment bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke tests
        run: npm run test:e2e

  database-advisors:
    name: Supabase security and performance advisors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: Check Supabase advisors
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase advisor check skipped because repository secrets are not configured."
            exit 0
          fi
          npm install --no-audit --no-fund
          npm run test:supabase-advisors
